    branch: feat/CROSS-BUG-2-dice-lib-port
    description: |
      Replace the current in-tree dice renderer with the new @local/dice-lib
      (~/Projects/dice-lib). The library exposes a tuner so we can adjust
      camera, jitter, trajectory, and slide-final behavior per game.

      Motivating symptom: during AI turns the dice freeze on a single die
      showing '2' while count/state advance normally — a front-end render
      bug that should disappear once the new renderer drives every turn
      (player and AI). Goal here is the port + tuning hooks, not preserving
      bug-for-bug behavior of the old renderer.
