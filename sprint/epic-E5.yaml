id: E5
type: epic
title: Risk Playtest Follow-up
description: 'Follow-ups from the first full multiplayer Risk playtest (great game, near-zero bugs) — legibility, transparency, and pre-game UX, no net-new rules engine. E5-1 reworks the attack overlay into an interactive per-round battle (dice/loss cards + Manual/Blitz/Stop) instead of auto-grinding. E5-2 verifies + records the ALREADY-implemented territory trade-in bonus; E5-6 surfaces the whole muster as an itemized breakdown (base/continent/trade-in/territory). E5-3 is a pre-game lobby (pick colors + roll-off for turn order). E5-4 fixes bot-portrait overlap. E5-5 improves smack-talk discoverability + chat presentation.'
priority: p2
status: backlog
