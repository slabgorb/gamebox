id: E2
type: epic
title: Risk LLM persona-style corpus and training
description: |
  Validate persona-style differentiation hypothesis, then (if validated) scale to
  full corpus and train a fine-tuned model that plays Risk in-character.

  Strategic frame: this thread is about STYLE, not win-rate. Heuristic engines
  already win more. The point is persona-distinguishable play. Every story below
  serves that gate.

  Pilot harness, collection mode, transcript-shape fixes, rate-limit retry, the
  six-pairing pilot wrapper, and the chi-square GO/NO-GO diagnostic all landed
  in PRs #58 + #60. This epic picks up at "run the pilot and act on the result."

  Decision tree:
    E2-1 (run pilot) -> E2-2 (read diagnostic) -> GO branch or NO-GO branch.
    GO   -> E2-3 .. E2-7 (scope corpus, collect, prep, fine-tune, integrate)
    NO-GO -> E2-3-alt, E2-4-alt (analyze failure, revise prompts, rerun)

  Out of scope: 6-player Risk engine, map redesign, persona UI/portraits.
priority: p1
status: in_progress
repos: g-1
stories:
  - id: E2-1
    title: Run pilot 150-game corpus + emit GO/NO-GO diagnostic
    description: |-
      RERUN on the carded engine (cards-first decision, 2026-05-21). The 46 cardless games in data/risk-corpus/pilot/ are DISCARDED. Execute scripts/risk-pilot.sh end-to-end: 6 pairings x 25 games = 150 games of Sonnet 4.6 in collection mode on the card-enabled engine. Then run scripts/risk-style-diag.mjs (per E2-9's possibly-revised metric) and capture GO/NO-GO + per-persona table. Deliverable: pilot-meta.json + 6 corpus JSONLs + docs/risk-llm/pilot-report.md with diagnostic output verbatim and a one-line recommendation.
    points: 2
    priority: p1
    status: done
    started: '2026-05-22'
    repos: g-1
    workflow: trivial
    depends_on: E2-9
