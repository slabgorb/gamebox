  - id: E2-8
    title: Risk cards engine mechanics (deck, award, trade-in, private hands)
    description: 'Implement canonical Risk territory cards in the 2-player engine. 44-card deck (42 territory cards typed Infantry/Cavalry/Artillery + 2 wild). Award one card at end of turn IFF the player captured >=1 territory that turn. Trade-in at reinforcement: valid sets (3-of-a-kind, 3-distinct, or 2+wild) yield escalating bonus armies (4,6,8,10,12,15, then +5 each) plus +2 on a held territory matching a card in the set. Forced trade-in when holding >=5 cards at reinforcement start. Hands are PRIVATE - view.js redacts opponent card identities (count only). State gains deck, per-player hands, tradeInCount. NOTE: invalidates the 46 cardless pilot games on disk; they will be discarded.'
    points: 8
    priority: p1
    status: done
    started: '2026-05-21'
    repos: g-1
    workflow: tdd
    acceptance_criteria:
      - 44-card deck built (42 territory cards typed Infantry/Cavalry/Artillery round-robin + 2 wild), shuffled deterministically per game seed
      - A card is awarded at end of turn only when the player captured >=1 territory that turn; no card otherwise
      - Trade-in accepts the three valid set shapes (3 same, 3 distinct, 2+wild) and rejects invalid sets via validate.js
      - Trade-in grants escalating bonus armies per the canonical sequence (4,6,8,10,12,15,+5...) tracked by tradeInCount
      - A traded set grants +2 armies placed on one owned territory matching a card in the set
      - Player holding >=5 cards at reinforcement start MUST trade before deploying (forced trade-in enforced)
      - view.js exposes own hand fully but only opponent card COUNT, never identities
      - reinforcementFor includes traded bonus armies; deck reshuffles from discard when exhausted
    completed: '2026-05-21'
    review_findings: 'HIGH: AC-8 reshuffle unimplemented (drawCard re-stacks discard without shuffling; docstring lies; predictable draw order). MEDIUM: 4 rejection tests use assert.ok(r.error) not assert.match (rule #8); missing capturedThisTurn-reset test. LOW: truthy checks (rule #4), view contract drift, isValidCardSet wild handling.'
    review_verdict: approved
  - id: E2-9
    title: Cards-aware AI + diagnostic re-validation (legal moves, prompt bump, board-eval)
    description: "Make the AI and pilot harness cards-aware so the rerun corpus reflects carded play. Extend legal-move enumeration to include trade-in options; update the LLM turn prompt to surface the bot's hand + trade-in choices and bump BUILD_TURN_PROMPT_VERSION; teach board-eval to value held cards / near-complete sets. Re-validate the GO/NO-GO diagnostic: attack-when-available is now distorted by the card-per-turn incentive, so confirm or revise the metric (candidates: post-card-secured aggression, trade-in timing) in scripts/risk-style-diag.mjs."
    points: 5
    priority: p1
    status: done
    started: '2026-05-22'
    repos: g-1
    workflow: tdd
    depends_on: E2-8
    acceptance_criteria:
      - Legal-move enumeration includes valid trade-in actions when the bot holds a tradeable set
      - LLM turn prompt includes the bot's current hand and available trade-in options
      - BUILD_TURN_PROMPT_VERSION bumped (corpus prompt-shape change recorded)
      - board-eval assigns positive value to held cards and near-complete sets
      - 'risk-style-diag.mjs reviewed: attack-when-available confirmed valid under cards OR replaced/supplemented with a card-robust style metric, rationale documented'
      - risk-full-game bot-vs-bot test passes end-to-end on the carded engine with at least one trade-in occurring
    completed: '2026-05-22'
    review_verdict: approved
  - id: E2-10
    title: Risk cards client UI (hand tray, trade-in, must-trade prompt)
    description: Client UI for cards. Hand tray showing the player's cards (type + territory), a trade-in selector that validates set shape before enabling submit, and a blocking must-trade prompt when holding >=5 cards. Opponent hand shows count only. NOT required for the headless pilot rerun - p2, does not block E2-1.
    points: 3
    priority: p2
    status: done
    started: '2026-05-21'
    repos: g-1
    workflow: trivial
    depends_on: E2-8
    acceptance_criteria:
      - Hand tray renders the player's own cards with type and territory name
      - Trade-in selector enables submit only for a valid set; shows the bonus army count it will grant
      - Must-trade modal blocks deploy actions when the player holds >=5 cards at reinforcement start
      - Opponent card count is shown; identities are never revealed client-side
    completed: '2026-05-21'
    review_findings: "3 blocking (High): React key={i} on the mutating hand list (CardTray.tsx:58) reconciles wrong DOM after a trade; core AC 'enables submit only for a valid set' has no negative test; must-trade modal duplicates the live tray body (a11y) and its contents are untested. Plus untested deselection/cap/reset branches, unused 'within' import, undocumented cardIndices ordering. Fixes are small and scoped."
    review_verdict: approved
  - id: E2-11
    title: Per-game-type AI model seam (Risk -> Sonnet 4.6, others stay Haiku)
    description: Add a per-game-type model map so each AI adapter selects its own LLM model, defaulting to DEFAULT_MODEL (Haiku) with Risk overridden to Sonnet (claude-sonnet-4-6). Today src/server/ai/index.js constructs a single shared ClaudeCliClient for all games; thread a per-game model through bootAiSubsystem -> orchestrator -> adapter so cribbage/backgammon/words stay on Haiku. This seam is also the precursor E2-7 needs to A/B a fine-tuned model against Sonnet in live Risk.
    points: 2
    priority: p1
    status: done
    started: '2026-05-21'
    repos: g-1
    workflow: trivial
    acceptance_criteria:
      - A per-game-type model map exists; the orchestrator resolves the correct model per game_type
      - Risk AI turns use claude-sonnet-4-6; cribbage/backgammon/words remain on the Haiku default
      - Game types with no override fall back to DEFAULT_MODEL
      - Existing AI tests pass; a test asserts Risk resolves to the Sonnet model and a non-Risk game resolves to Haiku
    completed: '2026-05-21'
decision:
  story: E2-2
  date: '2026-07-02'
  call: NO-GO
  source: docs/risk-llm/pilot-report.md
  rationale: |
    150-game pilot (6 pairings x 25, Sonnet 4.6, carded engine): both style
    metrics (attack-when-available and postCardSecuredAggression) saturate at
    ~97% across all three personas (1pp spread); only 1 of 3 pairwise
    chi-square tests met p<0.01. Root cause is architectural, not metric
    choice: the shortlist-based chooser pre-filters to mostly-aggressive
    options, so persona preference has nothing to choose against. Path: E2-3-alt
    (failure analysis) -> E2-4-alt (prompt revision + pilot rerun) -> loop back
    to a new branch decision. GO-path stories E2-3..E2-7 canceled.
