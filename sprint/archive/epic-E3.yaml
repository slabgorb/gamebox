id: E3
type: epic
title: Sorry! game plugin (full ruleset, 2P, vs AI)
description: |-
  Add a full-ruleset, 2-player Sorry! game plugin to Gamebox, playable vs two contrasting AI personas (The Bully, The Tortoise).

  Design:  docs/superpowers/specs/2026-05-27-sorry-plugin-design.md
  Plan:    docs/superpowers/plans/2026-05-27-sorry-plugin.md

  Self-contained plugin at plugins/sorry/ mirroring backgammon. Server-authoritative engine; card draw is an automatic server-side rule (no client RNG handshake). AI adapter enumerates legal moves and asks the LLM to pick a moveId, random-legal-move fallback on bad output. Two personas gate on games: [sorry].

  Out of scope: >2 players (Gamebox is 2P-only); additional personas beyond the initial two.
priority: p2
